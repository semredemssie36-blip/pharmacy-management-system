<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PharmaCore app icon</title>
  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="#10332B"/>

  <!-- Capsule, tilted 45 degrees -->
  <g transform="translate(256 256) rotate(-45)">
    <!-- Left half -->
    <path d="M0 -70 H-80 A70 70 0 0 0 -80 70 H0 Z" fill="#E3F1EA"/>
    <!-- Right half -->
    <path d="M0 -70 H80 A70 70 0 0 1 80 70 H0 Z" fill="#4FBF95"/>
    <!-- Seam -->
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#10332B" stroke-width="6"/>
    <!-- Medical cross (kept upright) -->
    <g transform="rotate(45 -72 0)" fill="#10332B">
      <rect x="-72" y="-6" width="56" height="12" rx="3" transform="translate(-28 0)"/>
      <rect x="-6" y="-28" width="12" height="56" rx="3" transform="translate(-72 0)"/>
    </g>
  </g>
</svg>
